<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" rx="16" fill="#111111"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#181818"/>
  <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="24" r="6" fill="#27C93F"/>
  <text x="100" y="28" fill="#A3A3A3" font-family="monospace" font-size="11">order-pipeline-telemetry.hicode.studio</text>

  <!-- Content -->
  <rect x="40" y="80" width="1120" height="555" rx="12" fill="#181818" stroke="#333333"/>
  <text x="70" y="125" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="22">Distributed Order Pipeline Architecture</text>
  <text x="70" y="150" fill="#A3A3A3" font-family="sans-serif" font-size="14">Sub-50ms ingestion latency with guaranteed order consistency</text>

  <!-- Flow Boxes -->
  <rect x="70" y="200" width="220" height="150" rx="8" fill="#222222" stroke="#FF6A00" stroke-width="1.5"/>
  <text x="90" y="235" fill="#FF6A00" font-family="mono" font-size="12">01. INGESTION</text>
  <text x="90" y="265" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="16">WebSocket Cluster</text>
  <text x="90" y="295" fill="#A3A3A3" font-family="sans-serif" font-size="12">40,000+ conn/sec</text>
  <text x="90" y="315" fill="#10B981" font-family="sans-serif" font-size="11">● 99.99% Uptime</text>

  <!-- Arrow 1 -->
  <path d="M305 275 L350 275" stroke="#FF6A00" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="365" y="200" width="220" height="150" rx="8" fill="#222222" stroke="#333333"/>
  <text x="385" y="235" fill="#FF6A00" font-family="mono" font-size="12">02. LOCKING</text>
  <text x="385" y="265" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="16">Redis Redlock</text>
  <text x="385" y="295" fill="#A3A3A3" font-family="sans-serif" font-size="12">Atomic Inventory Lock</text>
  <text x="385" y="315" fill="#10B981" font-family="sans-serif" font-size="11">● Zero Overselling</text>

  <!-- Arrow 2 -->
  <path d="M600 275 L645 275" stroke="#FF6A00" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="660" y="200" width="220" height="150" rx="8" fill="#222222" stroke="#333333"/>
  <text x="680" y="235" fill="#FF6A00" font-family="mono" font-size="12">03. PAYMENT</text>
  <text x="680" y="265" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="16">PromptPay / Stripe</text>
  <text x="680" y="295" fill="#A3A3A3" font-family="sans-serif" font-size="12">Auto Slip Verification</text>
  <text x="680" y="315" fill="#10B981" font-family="sans-serif" font-size="11">● Instant Settle</text>

  <!-- Arrow 3 -->
  <path d="M895 275 L940 275" stroke="#FF6A00" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="955" y="200" width="175" height="150" rx="8" fill="#222222" stroke="#333333"/>
  <text x="975" y="235" fill="#FF6A00" font-family="mono" font-size="12">04. DATABASE</text>
  <text x="975" y="265" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="16">PostgreSQL</text>
  <text x="975" y="295" fill="#A3A3A3" font-family="sans-serif" font-size="12">Partitioned Storage</text>
  <text x="975" y="315" fill="#10B981" font-family="sans-serif" font-size="11">● ACID Compliant</text>

  <!-- Code Snippet -->
  <rect x="70" y="380" width="1060" height="215" rx="8" fill="#111111" stroke="#252525"/>
  <text x="95" y="415" fill="#A3A3A3" font-family="monospace" font-size="12">// High-speed queue worker consumer</text>
  <text x="95" y="440" fill="#FF6A00" font-family="monospace" font-size="13">export async function <tspan fill="#F5F5F5">processIncomingOrder</tspan>(payload: LiveOrderEvent) {</text>
  <text x="120" y="465" fill="#F5F5F5" font-family="monospace" font-size="13">  const lock = await redis.acquireLock(`sku:${payload.sku}`, { ttl: 3000 });</text>
  <text x="120" y="490" fill="#F5F5F5" font-family="monospace" font-size="13">  const stock = await db.inventory.decrement({ sku: payload.sku, qty: payload.qty });</text>
  <text x="120" y="515" fill="#F5F5F5" font-family="monospace" font-size="13">  await websocket.emitToUser(payload.userId, "ORDER_CONFIRMED", { orderId: payload.id });</text>
  <text x="95" y="540" fill="#FF6A00" font-family="monospace" font-size="13">}</text>
  <text x="95" y="570" fill="#10B981" font-family="monospace" font-size="11">✓ Performance Benchmark: 12,000 tx/sec with 0% error rate</text>
</svg>
